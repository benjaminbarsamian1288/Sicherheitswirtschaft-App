name: Android-App bauen

on:
  push:
    branches:
      - 'claude/**'
      - 'ccr-**'
      - main
    paths:
      - 'android/**'
      - '*.html'
      - '*.js'
      - '*.json'
      - 'vendor/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: APKs bauen (Wachbuch + Rundgang)
        working-directory: android
        run: ./gradlew --no-daemon assembleWachbuchDebug assembleRundgangDebug

      - name: APKs benennen
        id: apk
        run: |
          set -e
          OUT=android/app/build/outputs/apk
          NAME="BB-PROTECT-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          cp "$OUT/wachbuch/debug/app-wachbuch-debug.apk" "$NAME"
          cp "$OUT/rundgang/debug/app-rundgang-debug.apk" BB-Rundgang.apk
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME" BB-Rundgang.apk

      - name: APKs als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: BB-PROTECT-APKs
          path: |
            ${{ steps.apk.outputs.name }}
            BB-Rundgang.apk
          retention-days: 90

      - name: Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=app-latest
          cat > notes.md <<'NOTES'
          Aktuelle Android-App (Wachbuch + EMA 3D).

          **Installation:** APK unten antippen, herunterladen und öffnen. Android fragt
          einmalig nach der Erlaubnis, Apps aus dieser Quelle zu installieren –
          bestaetigen, dann installiert die App.

          Die App laeuft vollstaendig offline, alle Daten bleiben auf dem Geraet.
          NOTES
          sed -i 's/^          //' notes.md
          echo "Gebaut aus Commit ${GITHUB_SHA::7}." >> notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "B·B PROTECT – Android-App" \
            --notes-file notes.md
          gh release view "$TAG" --json assets --jq '.assets[].browser_download_url'

      - name: Release Rundgang-App aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=rundgang-latest
          cat > notes-rg.md <<'NOTES'
          Aktuelle Android-App **BB Rundgang** – Kontrollgänge mit QR-Checkpunkten.

          **Installation:** BB-Rundgang.apk antippen, herunterladen und öffnen. Android fragt
          einmalig nach der Erlaubnis, Apps aus dieser Quelle zu installieren – bestaetigen.

          Die App laeuft offline, alle Daten bleiben auf dem Geraet.
          NOTES
          sed -i 's/^          //' notes-rg.md
          echo "Gebaut aus Commit ${GITHUB_SHA::7}." >> notes-rg.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" BB-Rundgang.apk \
            --target "$GITHUB_SHA" \
            --title "BB Rundgang – Android-App" \
            --notes-file notes-rg.md
          gh release view "$TAG" --json assets --jq '.assets[].browser_download_url'
