plugins {
    id 'com.android.application'
}

/* Die Web-App im Repo-Wurzelverzeichnis ist die einzige Quelle.
   Vor jedem Build wird sie in die App-Assets kopiert. */
def webRoot = rootProject.file('..')
def webAssetsDir = layout.buildDirectory.dir('webAssets').get().asFile

/* Jeder CI-Lauf erhöht den versionCode, damit sich eine neue APK
   ohne Deinstallation über die alte legt. */
def ciRun = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

tasks.register('copyWebApp', Copy) {
    from(webRoot) {
        include 'index.html', 'ema.html', 'android-bridge.js', 'manifest.json', 'sw.js'
        include 'logo.jpg', 'icon-192.png', 'icon-512.png'
        include 'vendor/**'
    }
    into webAssetsDir
}

android {
    namespace 'de.bbprotect.wachbuch'
    compileSdk 34

    defaultConfig {
        applicationId "de.bbprotect.wachbuch"
        minSdk 24
        targetSdk 34
        versionCode ciRun
        versionName "1.0.$ciRun"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs += webAssetsDir
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach {
    dependsOn 'copyWebApp'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
